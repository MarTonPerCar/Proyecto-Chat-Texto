<ion-header class="espaciador-header">
  <ion-toolbar class="toolbar-blanco">
    <ion-title></ion-title> <!-- Vacío a propósito -->
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">
  <form (ngSubmit)="login()">
    <ion-item>
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="email" name="email" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" [(ngModel)]="password" name="password" required></ion-input>
    </ion-item>

    <ion-button
      expand="block"
      type="submit"
      [disabled]="cargando || !email || !password">
      {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
    </ion-button>
  </form>
</ion-content>
