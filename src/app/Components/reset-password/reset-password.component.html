<main class="reset-password-container">
  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <h2>Restablecer Contraseña</h2>

    <div class="form-group">
      <label for="email">Correo Electrónico</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="ejemplo@correo.com"
        [class.invalid]="email?.invalid && (email?.dirty || email?.touched)"
      />
      <div *ngIf="email?.hasError('required') && (email?.dirty || email?.touched)" class="error">
        El correo electrónico es obligatorio.
      </div>
      <div *ngIf="email?.hasError('email') && (email?.dirty || email?.touched)" class="error">
        Ingresa un correo válido.
      </div>
    </div>

    <button type="submit" class="submit-btn">Enviar Enlace</button>

    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>

    <a [routerLink]="['/login']" class="back-link">Volver al Login</a>
  </form>
</main>
