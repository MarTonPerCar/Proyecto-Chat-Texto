<footer class="fw-footer" role="contentinfo">
  <div class="fw-container">
    <div class="fw-logo">
      <img id="Logo" [src]="logoSrc" alt="logo" />
    </div>

    <div class="fw-columns">
      <section class="fw-column" aria-labelledby="usecases-heading">
        <h3 id="usecases-heading" class="fw-column__title">Use cases</h3>
        <ul class="fw-column__list">
          <li class="fw-column__item"><a href="#" class="fw-column__link">UI design</a></li>
          <li class="fw-column__item"><a href="#" class="fw-column__link">UX design</a></li>
          <li class="fw-column__item"><a href="#" class="fw-column__link">Wireframing</a></li>
        </ul>
      </section>

      <section class="fw-column" aria-labelledby="explore-heading">
        <h3 id="explore-heading" class="fw-column__title">Explore</h3>
        <ul class="fw-column__list">
          <li class="fw-column__item"><a href="#" class="fw-column__link">Design</a></li>
          <li class="fw-column__item"><a href="#" class="fw-column__link">Prototyping</a></li>
          <li class="fw-column__item"><a href="#" class="fw-column__link">Development features</a></li>
        </ul>

      <section class="fw-column" aria-labelledby="resources-heading">
        <h3 id="resources-heading" class="fw-column__title">Resources</h3>
        <ul class="fw-column__list">
          <li class="fw-column__item"><a href="#" class="fw-column__link">Blog</a></li>
          <li class="fw-column__item"><a href="#" class="fw-column__link">Best practices</a></li>
          <li class="fw-column__item"><a href="#" class="fw-column__link">Colors</a></li>
        </ul>

    </div>

    <div class="fw-social">
      <a href="#" class="fw-social__link" aria-label="Instagram">
