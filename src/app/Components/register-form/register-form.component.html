<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-container">

  <div class="form-group">
    <label for="email">Correo Electrónico</label>
    <input id="email" type="email" placeholder="Ingrese su correo"
           formControlName="email" [class.invalid]="isTouchedAndInvalid('email')">
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="Ingrese su contraseña"
           formControlName="password" [class.invalid]="isTouchedAndInvalid('password')">
  </div>

  <div class="form-group">
    <label for="confirmPassword">Repetir Contraseña</label>
    <input id="confirmPassword" type="password" placeholder="Repita su contraseña"
           formControlName="confirmPassword" [class.invalid]="isTouchedAndInvalid('confirmPassword')">
  </div>

  <div class="form-group">
    <label for="firstName">Nombre</label>
    <input id="firstName" type="text" placeholder="Ingrese su nombre"
           formControlName="firstName" [class.invalid]="isTouchedAndInvalid('firstName')">
  </div>

  <div class="form-group">
    <label for="lastName">Apellido</label>
    <input id="lastName" type="text" placeholder="Ingrese su apellido"
           formControlName="lastName" [class.invalid]="isTouchedAndInvalid('lastName')">
  </div>

  <div class="form-group">
    <label for="phone">Número de Teléfono</label>
    <input id="phone" type="tel" placeholder="Ejemplo: +123456789"
           formControlName="phone" [class.invalid]="isTouchedAndInvalid('phone')">
  </div>

  <div class="error-message" *ngIf="registerForm.errors?.['notMatching'] && registerForm.dirty">
    Las contraseñas no coinciden.
  </div>

  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <button type="submit">REGISTRARSE</button>
</form>
