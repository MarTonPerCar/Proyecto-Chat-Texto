<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-container">
  <div class="form-group">
    <label for="email">Correo Electrónico</label>
    <input id="email" type="email" placeholder="Ingrese su correo"
           formControlName="email" [class.invalid]="email?.invalid && (email?.dirty || email?.touched)">
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="Ingrese su contraseña"
           formControlName="password" [class.invalid]="password?.invalid && (password?.dirty || password?.touched)">
  </div>

  <div class="form-group">
    <label for="confirmPassword">Repetir Contraseña</label>
    <input id="confirmPassword" type="password" placeholder="Repita su contraseña"
           formControlName="confirmPassword" [class.invalid]="confirmPassword?.invalid && (confirmPassword?.dirty || confirmPassword?.touched)">
  </div>

  <div class="form-group">
    <label for="firstName">Nombre</label>
    <input id="firstName" type="text" placeholder="Ingrese su nombre"
           formControlName="firstName" [class.invalid]="firstName?.invalid && (firstName?.dirty || firstName?.touched)">
  </div>

  <div class="form-group">
    <label for="lastName">Apellido</label>
    <input id="lastName" type="text" placeholder="Ingrese su apellido"
           formControlName="lastName" [class.invalid]="lastName?.invalid && (lastName?.dirty || lastName?.touched)">
  </div>

  <div class="form-group">
    <label for="phone">Número de Teléfono</label>
    <input id="phone" type="tel" placeholder="Ejemplo: +123456789"
           formControlName="phone" [class.invalid]="phone?.invalid && (phone?.dirty || phone?.touched)">
  </div>

  <button type="submit">REGISTRARSE</button>
</form>
