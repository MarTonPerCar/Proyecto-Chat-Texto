<header class="header" role="banner" *ngIf="user$ | async as user; else notLoggedIn">
  <div class="logo-container">
    <a [routerLink]="['/']" target="_self">
      <img id="Main_Icon" src="" alt="logo" />
    </a>
  </div>

  <div class="user-section-header">
    <button class="button-header-login">
      <a [routerLink]="['/chat']"><img id="Inicio" [src]="inicioIcon" alt="Inicio" /></a>
    </button>

    <button class="button-header-login">
      <a [routerLink]="['/settings']">
        <ng-container *ngIf="datosImagen$ | async as img">
          <img id="Configuracion" [src]="img.url" alt="Imagen de settings" />
        </ng-container>

      </a>
    </button>

    <span class="username">{{ user.email }}</span>

    <div class="avatar-container">
      <a [routerLink]="['/profile']">
        <ng-container *ngIf="datosUsuario$ | async as datos">
          <img id="avatarPng" [src]="datos.url" alt="Avatar" />
        </ng-container>
      </a>
    </div>
  </div>
</header>

<!-- Si el usuario NO está logueado -->
<ng-template #notLoggedIn>
  <header class="header">
    <div class="logo">
      <a [routerLink]="['/']" target="_self">
        <img id="Main_Icon" [src]="logoSrc" alt="logo" />
      </a>
    </div>

    <nav class="nav">
      <a [routerLink]="['/login']" class="nav-link">
        <button class="button sign-in">Sign in</button>
      </a>
      <a [routerLink]="['/register']" class="nav-link">
        <button class="button register">Register</button>
      </a>
    </nav>
  </header>
</ng-template>
