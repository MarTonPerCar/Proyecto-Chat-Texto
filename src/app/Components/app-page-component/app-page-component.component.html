<div class="container">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="chat-header">
      <span>Mis Chats</span>
      <div class="chat-buttons">
        <button class="icon-button" id="add-contact">
          <a id="addContactLink" [routerLink]="['/addContact']">
            <img id="addContact" src="assets/addContact-icon.png" alt="Añadir Contacto" />
          </a>
        </button>
        <button class="icon-button" id="create-group">
          <a id="addGroupLink" [routerLink]="['/addGroup']">
            <img id="addGroup" src="assets/addGroup-icon.png" alt="Crear Grupo" />
          </a>
        </button>
      </div>
    </div>

    <div class="chat-list-Start">
      <!-- Si no hay contactos ni grupos, se muestra un mensaje -->
      <div *ngIf="contactos.length === 0 && grupos.length === 0" class="no-contactos">
        Todavía no has agregado a nadie
      </div>

      <!-- Listado de Contactos -->
      <ng-container *ngIf="contactos && contactos.length > 0">
        <div class="section-header">Mis Contactos</div>
        <div *ngFor="let contacto of contactos">
          <app-conversation
            [nombre]="contacto.nombre"
            [estado]="contacto.estado"
            [avatarUrl]="contacto.avatarUrl"
            (click)="seleccionarUsuario(contacto)">
          </app-conversation>
        </div>
      </ng-container>

      <!-- Listado de Grupos -->
      <ng-container *ngIf="grupos && grupos.length > 0">
        <div class="section-header">Mis Grupos</div>
        <div *ngFor="let grupo of grupos">
          <app-conversation
            [nombre]="grupo.nombre"
            [estado]="grupo.descripcion"
            [avatarUrl]="grupo.url"
            (click)="seleccionarGrupo(grupo)">
          </app-conversation>
        </div>
      </ng-container>
    </div>
  </aside>

  <!-- Área principal de chat -->
  <div class="chat-container">
    <div class="top-chat">
      <app-avatar
        [avatarUrlMini]="miAvatarUrlMini"
        [nombreMini]="miNombreMini">
      </app-avatar>
    </div>

    <div class="chat-messages" id="messageContainer">
      <div class="messages">
        <!-- Mensajes de ejemplo -->
        <div class="message">¡Hola! ¿Cómo estás?</div>
        <div class="message">¿Vamos a jugar al padel hoy?</div>
        <div class="message">No te olvides de traer la comida.</div>
      </div>
    </div>

    <div class="chat-input">
      <button class="emoji-btn">😊</button>
      <button class="attach-btn">📎</button>
      <input type="text" placeholder="Escribe un mensaje..." />
      <button class="send-btn">Enviar</button>
    </div>
  </div>
</div>
