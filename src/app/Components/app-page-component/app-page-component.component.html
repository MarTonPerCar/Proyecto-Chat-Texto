<div class="container">
  <!-- Sidebar -->
  <aside id="sidebar">
    <!-- Header con botones -->
    <div id="chat-header" [ngClass]="{ 'borrar-activo': modoEliminarActivo }">
      <span>{{ modoEliminarActivo ? '¿Eliminar?' : 'Mis Chats' }}</span>
      <div class="chat-buttons">
        <button class="icon-button" id="add-contact">
          <a [routerLink]="['/addContact']">
            <img *ngIf="datosImagenAddContanct$ | async as datosAddContact" [src]="datosAddContact.url" alt="Añadir Contacto">
          </a>
        </button>
        <button class="icon-button" id="create-group">
          <a [routerLink]="['/addGroup']">
            <img *ngIf="datosImagenAddGroup$ | async as datosAddGroup" [src]="datosAddGroup.url" alt="Crear Grupo">
          </a>
        </button>
        <button class="icon-button" id="delete-contact" (click)="activarModoEliminar()">
          <a>
            <img *ngIf="datosImagenDeleteContact$ | async as datosDeleteContact" [src]="datosDeleteContact.url" alt="Eliminar Contacto">
          </a>
        </button>
      </div>
    </div>

    <!-- Listado de contactos y grupos -->
    <div class="chat-list-Start">
      <div *ngIf="contactos.length === 0 && grupos.length === 0" class="no-contactos">
        Todavía no has agregado a nadie
      </div>

      <!-- Contactos -->
      <div *ngIf="contactos.length > 0">
        <div class="section-header">Mis Contactos</div>
        <div *ngFor="let contacto of contactos; let i = index">
          <app-conversation
            [nombre]="contacto.nombre"
            [estado]="contacto.estado"
            [avatarUrl]="contacto.avatarUrl"
            [class.selected]="selectedIndex === i"
            (click)="seleccionarUsuario(contacto, i)">
          </app-conversation>
        </div>
      </div>

      <!-- Grupos -->
      <div *ngIf="grupos.length > 0">
        <div class="section-header">Mis Grupos</div>
        <div *ngFor="let grupo of grupos; let j = index">
          <app-conversation
            [nombre]="grupo.nombre"
            [estado]="grupo.descripcion"
            [avatarUrl]="grupo.url"
            [class.selected]="selectedGrupoIndex === j"
            (click)="seleccionarGrupo(grupo, j)">
          </app-conversation>
        </div>
      </div>
    </div>
  </aside>

  <!-- Área principal de chat -->
  <div class="chat-container">
    <div class="top-chat">
      <app-avatar
        [avatarUrlMini]="miAvatarUrlMini"
        [nombreMini]="miNombreMini">
      </app-avatar>
    </div>

    <div class="chat-messages" id="messageContainer">
      <div class="messages">
        <!-- Mensajes de prueba -->
        <div class="message">¡Hola! ¿Cómo estás?</div>
        <div class="message">¿Vamos a jugar al pádel hoy?</div>
        <div class="message">No te olvides de traer la comida.</div>
      </div>
    </div>

    <div class="chat-input">
      <button class="emoji-btn">😊</button>
      <button class="attach-btn">📎</button>
      <input type="text" placeholder="Escribe un mensaje..." />
      <button class="send-btn">Enviar</button>
    </div>
  </div>
</div>
