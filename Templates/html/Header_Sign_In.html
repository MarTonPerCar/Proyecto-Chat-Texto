<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Header Template</title>

    <script type="module" src="../javascript/headerSignIn.js"></script>
    <link id="cssHeaderSignInLink" rel="stylesheet">
  </head>

  <body>

  <header class="header">
    <div class="logo-container">
      <a id="indexLink" target="_self">
        <img src="icon.png" alt="Logo" class="logo-img">
      </a>
      <span class="logo-text">Instant Message</span>
    </div>

    <div class="user-section-header">
      <button class="button-header-login">
        <a id="startLink"><img id="startImg" alt="Inicio" class="btn-img"></a>
      </button>

      <button class="button-header-login">
        <a id="settingsLink"><img id="configImg" alt="Configuración" class="btn-img"></a>
      </button>

      <span class="username">Usuario</span>

      <div class="avatar-container">
        <a id="profileLink"><img id="avatarImg" alt="Foto de perfil" class="circular-img"></a>
      </div>
    </div>

  </header>

  </body>
</html>
