<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML5, CSS3, JavaScript">
    <title>Crear Grupo</title>

    <script type="module" src="../javascript/addGroup.js"></script>
    <link id="cssColorsLink" rel="stylesheet">
    <link id="cssAddGroup" rel="stylesheet">
  </head>
  <body>

    <header id="header-sign-in"></header>

    <main class="group-container">
      <!-- Imagen del grupo -->
      <div class="group-image">
        <img id="avatarPng" src="" alt="logo"/>
      </div>

      <!-- Formulario -->
      <form class="group-form">
        <label for="group-name">Nombre grupo</label>
        <input type="text" id="group-name" placeholder="Nombre del grupo">

        <label for="group-description">Descripción</label>
        <textarea id="group-description" placeholder="Añade una descripción"></textarea>
      </form>

      <!-- Sección de imágenes de usuarios -->
      <div class="user-section">
        <img id="avatarPng1" src="" alt="logo"/>
        <div class="user-list">
          <!-- -->
          <img id="avatarPng2" src="" alt="logo"/>
          <img id="avatarPng3" src="" alt="logo"/>
          <button class="add-user">+</button>
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="action-buttons">
        <a id = "startLink" class="button-group decline">Decline</a>
        <a id = "startLink2" class="button-group create">Create</a>
      </div>
    </main>



    <footer id="footer"></footer>

  </body>
</html>
