<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Estilo WhatsApp Web</title>

  <script type="module" src="../javascript/start.js"></script>

  <link id="cssStartLink" rel="stylesheet">
</head>
<body class = "body-start">

<header id="header-sign-in"></header>

<div class="container">
  <aside id="sidebar">
    <div id="chat-header">
      <span>Mis Chats</span>
      <div class="chat-buttons">
        <button class="icon-button" id="add-contact">
          <a id="addContact">
            <img id="addContactImg" src="" alt="Añadir Contacto">
          </a>
        </button>
        <button class="icon-button" id="create-group">
          <a id="addGroup">
            <img id="addGroupImg" src="" alt="Crear Grupo">
          </a>
        </button>
      </div>
    </div>

    <div class="chat-list" id="conversation">
      <div id="conversations" class="conversation"></div>
      <div class="conversation"></div>
    </div>
  </aside>

  <main class="chat-container">
    <div class="user-info-template" id="userInfo">
      <a id='avatar-nombre'>
        <img id="avatar" src="" alt="Avatar">
      </a>
    </div>
    <div class="chat-messages" id="messageContainer">
      <div class="messages">
        <div id="mensajes" class="message sent"></div>
        <div class="mensajes"></div>
      </div>
    </div>

    <div class="chat-input">
      <button class="emoji-btn">😊</button>
      <button class="attach-btn">📎</button>
      <input type="text" placeholder="Escribe un mensaje...">
      <button class="send-btn">Enviar</button>
    </div>
  </main>
</div>

<footer id="footer"></footer>

</body>
</html>
